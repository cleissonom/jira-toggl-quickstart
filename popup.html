<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jira → Toggl</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/icon32.png" alt="" aria-hidden="true" />
        <div>
          <strong>Jira → Toggl</strong>
          <span id="workspace">Loading…</span>
        </div>
      </header>

      <section
        id="worked-today"
        class="worked-today"
        aria-labelledby="worked-today-title worked-week-title"
      >
        <div class="worked-period">
          <span id="worked-today-title" class="kicker">Worked today</span>
          <strong id="worked-today-value">Loading…</strong>
        </div>
        <div class="worked-period">
          <span id="worked-week-title" class="kicker">Worked this week</span>
          <strong id="worked-week-value">Loading…</strong>
        </div>
        <small id="worked-today-message" class="hidden"></small>
      </section>

      <section id="timer" class="timer hidden" aria-live="polite">
        <div class="timer-heading">
          <span class="kicker">Current timer</span>
          <span id="billing" class="billing hidden"></span>
        </div>
        <p id="description"></p>
        <time id="elapsed">00:00:00</time>
      </section>

      <section id="manual" class="manual hidden" aria-labelledby="manual-title">
        <div class="manual-heading">
          <span id="manual-title" class="kicker">Start a timer</span>
          <span id="manual-billing" class="manual-default"></span>
        </div>
        <form id="manual-form">
          <label for="manual-description">What are you working on?</label>
          <input
            id="manual-description"
            name="description"
            type="text"
            maxlength="1000"
            autocomplete="off"
            placeholder="Type a timer description"
            required
          />
          <small id="manual-context">Uses your saved Toggl defaults.</small>
          <button id="start" class="primary" type="submit">Start timer</button>
        </form>
      </section>

      <section id="jira-progress" class="jira-progress hidden" aria-labelledby="jira-progress-title">
        <div class="jira-progress-heading">
          <span id="jira-progress-title" class="kicker">Jira progress</span>
          <span id="jira-key" class="jira-key"></span>
        </div>
        <p id="jira-progress-summary" class="jira-progress-summary"></p>
        <p id="jira-progress-detail" class="jira-progress-detail"></p>
        <button id="copy-jira" class="secondary copy-jira hidden" type="button">
          Copy Jira title &amp; description
        </button>
        <p id="copy-status" class="copy-status hidden" role="status" aria-live="polite"></p>
      </section>

      <button id="stop" class="danger full-width hidden" type="button">Stop timer</button>

      <section id="worklogs" class="worklogs hidden" aria-labelledby="worklogs-title">
        <div class="worklogs-heading">
          <span id="worklogs-title" class="kicker">Jira Work Logs</span>
          <span id="worklogs-count" class="worklogs-count"></span>
        </div>
        <ul id="worklogs-list"></ul>
        <button id="sync-worklogs" class="secondary" type="button">Sync pending Work Logs</button>
      </section>

      <p id="empty" class="empty">Checking Toggl…</p>
      <p id="notice" class="notice hidden" role="status" aria-live="polite"></p>
      <p id="error" class="error hidden" role="alert"></p>

      <button id="settings" class="secondary full-width settings-button" type="button">Settings</button>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
