name: Feature request
description: Suggest a focused improvement that supports the extension's Jira-to-Toggl purpose.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Keep requests within the extension's single purpose and do not include private Jira or Toggl information.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
